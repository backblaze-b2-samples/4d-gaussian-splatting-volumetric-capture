# Complete Python 3.12 resolution for the API runtime, tests, and quality tools.
#
# Platform: resolved for CPython 3.12 on Linux/macOS (what setup and CI use).
# Pins are exact and carry no environment markers, so Windows is unsupported
# here (e.g. uvloop ships no Windows wheels). If Windows support is ever needed,
# regenerate with a marker-preserving tool (pip-tools' pip-compile) rather than
# pip freeze.
#
# BASE deps only — the CUDA-only training engine (torch + 4DGaussians) is out of
# this lock and installed separately by scripts/setup_engine.sh on a CUDA host.
#
# Keep requirements.txt as the human-edited input. Refresh this file only from
# a clean Python 3.12 virtual environment as documented in
# docs/dev-workflows.md, then review the lock and OpenAPI contract together.
